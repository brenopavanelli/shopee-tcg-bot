name: Publicador de Ofertas

concurrency:
  group: tcgbot-state
  cancel-in-progress: false

on:
  schedule:
    - cron: "3,23,43 9-23,0-2 * * *"
    - cron: "13 3-8 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Publicar
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_DRY_RUN: "false"
          TELEGRAM_DRY_RUN: "false"
        run: python -m tcgbot.publisher
      - name: Salvar estado
        run: |
          git config user.name "tcgbot"
          git config user.email "tcgbot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: atualiza estado (publicador)"
          git push